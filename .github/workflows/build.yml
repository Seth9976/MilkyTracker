name: Build MilkyTracker for Windows  
  
on:  
  push:  
    branches: [ master ]  
  pull_request:  
  workflow_dispatch:  
  
jobs:  
  build-windows:  
    runs-on: windows-latest  
  
    steps:  
      - name: Checkout source with submodules  
        uses: actions/checkout@v4  
        with:  
          submodules: recursive  
  
      - name: Install CMake 3.31.x  
        uses: jwlawson/actions-setup-cmake@v2  
        with:  
          cmake-version: '3.31.x'  
  
      - name: Verify CMake version  
        run: cmake --version  
  
      - name: Detect installed Visual Studio via vswhere  
        run: |  
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"  
          $vsPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath  
          $vsVersion = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationVersion  
          Write-Output "Detected VS path: $vsPath"  
          Write-Output "Detected VS version: $vsVersion"  
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"  
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found under $vsPath" }  
          Write-Output "VCVARS=$vcvars" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append  
  
      - name: Configure with Ninja inside MSVC environment  
        run: cmd /c "call `"$env:VCVARS`" >nul && cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release"  
  
      - name: Probe build tree  
        run: Get-ChildItem -Path build -Recurse -Depth 2 | Select-Object FullName  
  
      - name: Build with Ninja inside MSVC environment  
        run: cmd /c "call `"$env:VCVARS`" >nul && cmake --build build --parallel"  
  
      - name: Probe generated binaries  
        run: Get-ChildItem -Path build -Recurse -Include *.exe,*.dll | Select-Object FullName,Length  
  
      - name: Upload binaries artifact  
        uses: actions/upload-artifact@v4  
        with:  
          name: milkytracker-windows-x64  
          path: |  
            build/**/*.exe  
            build/**/*.dll  
          if-no-files-found: warn

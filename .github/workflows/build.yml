name: Build MilkyTracker for Windows

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake using Visual Studio 2022
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Probe build directory structure before compilation
        run: Get-ChildItem -Path build -Recurse -Depth 2 | Select-Object -Property FullName

      - name: Build external dependency targets
        run: cmake --build build --config Release --target zlib

      - name: Build complete project solution
        run: cmake --build build --config Release --parallel

      - name: Probe generated executable and library binaries
        run: Get-ChildItem -Path build -Recurse -Include *.exe,*.dll,*.lib | Select-Object -Property FullName,Length

      - name: Execute packaging via CPack
        working-directory: build
        run: cpack -C Release

      - name: Probe and register generated package file path  
        id: probe-package  
        shell: pwsh  
        run: |  
          $packageFile = (Get-ChildItem -Path build -Recurse -Filter *.zip | Select-Object -First 1).FullName  
          if (-not $packageFile) { throw "CPack output package was not found." }  
          Write-Output "Detected package: $packageFile"  
          Write-Output "PACKAGE_PATH=$packageFile" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append


      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: milkytracker-windows-x64
          path: ${{ env.PACKAGE_PATH }}
          if-no-files-found: error

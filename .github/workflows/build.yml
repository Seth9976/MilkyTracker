name: Build MilkyTracker for Windows  
  
on:  
  push:  
    branches: [ master ]  
  pull_request:  
  workflow_dispatch:  
  
jobs:  
  build-windows:  
    runs-on: windows-latest  
  
    steps:  
      - name: Checkout source with submodules  
        uses: actions/checkout@v4  
        with:  
          submodules: recursive  
  
      - name: Install latest CMake  
        uses: jwlawson/actions-setup-cmake@v2  
        with:  
          cmake-version: 'latest'  
  
      - name: Verify CMake version  
        run: cmake --version  
  
      - name: Detect installed Visual Studio via vswhere  
        run: |  
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"  
          $vsPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath  
          $vsVersion = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationVersion  
          Write-Output "Detected VS path: $vsPath"  
          Write-Output "Detected VS version: $vsVersion"  
          $major = [int]($vsVersion.Split('.')[0])  
          switch ($major) {  
            17 { $generator = "Visual Studio 17 2022" }  
            18 { $generator = "Visual Studio 18 2026" }  
            default { throw "Unsupported Visual Studio major version: $major" }  
          }  
          Write-Output "Using CMake generator: $generator"  
          Write-Output "VS_PATH=$vsPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append  
          Write-Output "CMAKE_GENERATOR=$generator" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append  
  
      - name: Configure CMake with detected generator  
        run: cmake -S . -B build -G "$env:CMAKE_GENERATOR" -A x64  
  
      - name: Probe build tree before compilation  
        run: Get-ChildItem -Path build -Recurse -Depth 2 | Select-Object FullName  
  
      - name: Build Release configuration  
        run: cmake --build build --config Release --parallel  
  
      - name: Probe generated binaries  
        run: Get-ChildItem -Path build -Recurse -Include *.exe,*.dll | Select-Object FullName,Length  
  
      - name: Package with CPack (ZIP)  
        working-directory: build  
        run: cpack -C Release  
  
      - name: Probe produced packages  
        run: Get-ChildItem -Path build -Recurse -Include *.zip | Select-Object FullName,Length  
  
      - name: Upload ZIP package artifact  
        uses: actions/upload-artifact@v4  
        with:  
          name: milkytracker-windows-x64  
          path: build/milkytracker*.zip  
          if-no-files-found: warn

name: Build MilkyTracker for Windows  
  
on:  
  push:  
    branches: [ master ]  
  pull_request:  
  workflow_dispatch:  
  
jobs:  
  build-windows:  
    runs-on: windows-latest  
  
    steps:  
      - name: Checkout source with submodules  
        uses: actions/checkout@v4  
        with:  
          submodules: recursive  
  
      - name: Install CMake 3.31.x  
        uses: jwlawson/actions-setup-cmake@v2  
        with:  
          cmake-version: '3.31.x'  
  
      - name: Verify CMake version  
        run: cmake --version  
  
      - name: Configure CMake (Visual Studio 2022 generator)  
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64  
  
      - name: Probe build tree before compilation  
        run: Get-ChildItem -Path build -Recurse -Depth 2 | Select-Object FullName  
  
      - name: Build Release configuration  
        run: cmake --build build --config Release --parallel  
  
      - name: Probe generated binaries  
        run: Get-ChildItem -Path build -Recurse -Include *.exe,*.dll | Select-Object FullName,Length  
  
      - name: Package with CPack (ZIP)  
        working-directory: build  
        run: cpack -C Release  
  
      - name: Probe produced packages  
        run: Get-ChildItem -Path build -Recurse -Include *.zip | Select-Object FullName,Length  
  
      - name: Upload ZIP package artifact  
        uses: actions/upload-artifact@v4  
        with:  
          name: milkytracker-windows-x64  
          path: build/milkytracker*.zip  
          if-no-files-found: warn
